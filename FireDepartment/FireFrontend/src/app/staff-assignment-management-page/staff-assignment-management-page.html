<div class="container-fluid mt-3 w-100 px-4">
  <h1 class="text-white">Staff Assignment Management</h1>

  <ul class="nav nav-tabs border-secondary mb-3">
    <li class="nav-item">
      <a class="nav-link" [class.active]="view === 'work'" (click)="view = 'work'" role="button">Work Date</a>
    </li>
    <li class="nav-item">
      <a class="nav-link" [class.active]="view === 'approval'" (click)="view = 'approval'" role="button">Approvals</a>
    </li>
  </ul>

  @if (view === 'work') {
    <div class="d-flex align-items-center bg-dark p-2 border border-secondary mb-2 gap-2">
      <div class="d-flex align-items-center border border-secondary px-2">
        <label class="text-secondary small me-2 mb-0">Work Date</label>
        <input type="date" class="bg-transparent text-white border-0 py-1">
      </div>
      <button class="btn btn-sm btn-dark border-secondary dropdown-toggle" (click)="drop1=!drop1">-- All --</button>
      <button class="btn btn-sm btn-dark border-secondary dropdown-toggle">Station:</button>
      <button class="btn btn-sm btn-dark border-secondary dropdown-toggle">Company:</button>
      
      <div class="form-check form-switch ms-auto">
        <label class="form-check-label text-white me-2">Active Only</label>
        <input class="form-check-input" type="checkbox" checked>
      </div>
    </div>

    <div class="d-flex justify-content-between mb-3">
      <div class="d-flex gap-2">
        <button class="btn btn-success btn-sm">+ Create Assignment</button>
        <button class="btn btn-primary btn-sm">Bulk Assign</button>
      </div>
      <input type="text" class="form-control form-control-sm w-25 bg-dark text-white border-secondary" placeholder="Search...">
    </div>
  }

  @else if (view === 'approval') {
    <div class="d-flex align-items-center bg-dark p-2 border border-secondary mb-2 gap-2">
      <div class="d-flex align-items-center border border-secondary px-2">
        <label class="text-secondary small me-2 mb-0">Request Date</label>
        <input type="date" class="bg-transparent text-white border-0 py-1">
      </div>
      <button class="btn btn-sm btn-dark border-secondary dropdown-toggle">Station:</button>
      <button class="btn btn-sm btn-dark border-secondary dropdown-toggle">Shift:</button>
      <button class="btn btn-sm btn-dark border-secondary dropdown-toggle">Status:</button>
    </div>

    <div class="d-flex gap-2 mb-3">
      <button class="btn btn-warning btn-sm fw-bold">Pending (4)</button>
      <button class="btn btn-success btn-sm fw-bold">Approved (9)</button>
      <button class="btn btn-danger btn-sm fw-bold">Denied (2)</button>
      <button class="btn btn-secondary btn-sm fw-bold">Returned (1)</button>
    </div>
  }

  <table class="table table-dark table-hover border-secondary mt-3">
    <thead class="table-secondary text-dark">
      <tr><th>ROIC</th><th>Name</th><th>Rank</th><th>Station</th><th>Status</th></tr>
    </thead>
    <tbody>
      <tr><td>1223</td><td>Daniel Smith</td><td>Captain</td><td>Station 2</td><td>Active</td></tr>
    </tbody>
  </table>
</div>
