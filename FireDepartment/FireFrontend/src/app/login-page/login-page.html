<div class="vh-100 d-flex flex-column justify-content-center align-items-center bg-black">
  <div class="text-center mb-4">
    <img src="/assets/FireDepartment.png" class="mb-2 w-50" alt="Fire Dept Logo">
    <h1 class="h2 fw-light text-white mb-0">Fire Department</h1>
    <p class="text-secondary small">Management System</p>
  </div>

  <div class="card border-secondary p-4 shadow-lg" style="width: 24rem; background-color: #1f1f1f;">
    <div class="input-group mb-3">
      <span class="input-group-text bg-transparent border-secondary text-secondary">👤</span>
      <input type="text" class="form-control bg-transparent border-secondary text-white" placeholder="Username">
    </div>
    
    <div class="input-group mb-3">
      <span class="input-group-text bg-transparent border-secondary text-secondary">🔒</span>
      <input type="password" class="form-control bg-transparent border-secondary text-white" placeholder="Password">
    </div>

    <div class="d-flex justify-content-between align-items-center mb-4">
      <div class="form-check mb-0">
        <input class="form-check-input bg-primary" type="checkbox" id="remember" checked>
        <label class="form-check-label small text-secondary" for="remember">Remember Me</label>
      </div>
      <a href="#" class="text-info text-decoration-none small">Forgot Password?</a>
    </div>

    <button class="btn btn-primary w-100 py-2 fw-bold shadow">Log In</button>
