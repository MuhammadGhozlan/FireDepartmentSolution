<nav class="navbar navbar-expand-lg bg-primary" data-bs-theme="dark">
    <div class="container-fluid">
        <div class="container-fluid d-flex">
            <img class="d-inline-block align-top" width="30" height="30" src="assets/FireDepartment.png" />
            <span class="fw-bold" style="margin-left: 2% ;">Home</span>
        </div>
        <a class="navbar-brand" href="#"><span class="fw-bold pe-2">City of Tulsa</span> Fire Department</a>
    </div>
</nav>

<div class="hero-bg container-fluid d-flex align-items-center mb-4"
    style="height: 150px; background-position: center; background-size: cover;">
    <div class="container text-center">
        <h1 class="text-white fw-bold drop-shadow" style="">Daily Attendance</h1>
    </div>
</div>

<div class="container-fluid px-5">

    <div class="row g-3 align-items-center mb-4 bg-dark bg-opacity-50 p-3 rounded-3 border border-secondary">
        <div class="col-auto">
            <div class="input-group">
                <span class="input-group-text bg-dark border-secondary text-white-50"><i
                        class="bi bi-calendar3"></i></span>
                <input type="date" class="form-control bg-dark text-white border-secondary border-start-0"
                    value="2024-04-24">
            </div>
        </div>

        <div class="col-auto">
            <select class="form-select bg-dark text-white border-secondary">
                <option selected>A Shift</option>
                <option>B Shift</option>
                <option>C Shift</option>
            </select>
        </div>
        <div class="col-auto">
            <select class="form-select bg-dark text-white border-secondary">
                <option selected>All Stations</option>
                <option>Station 1</option>
                <option>Station 2</option>
            </select>
        </div>

        <div class="col">
            <div class="input-group">
                <span class="input-group-text bg-dark border-secondary text-white-50"><i
                        class="bi bi-search"></i></span>
                <input type="text" class="form-control bg-dark text-white border-secondary border-start-0"
                    placeholder="Search personnel...">
            </div>
        </div>

        <div class="col-auto">
            <button class="btn btn-warning fw-bold text-dark">Search</button>
            <button class="btn btn-secondary ms-2">Cancel</button>
        </div>
    </div>

    <div class="table-responsive" style="max-height: 600px; overflow-y: auto;">
        <table class="table table-dark table-hover align-middle border-secondary">
            <thead class="table-secondary text-uppercase small">
                <tr>
                    <th>ID</th>
                    <th>ROIC</th>
                    <th>Name</th>
                    <th>Station</th>
                    <th>Company</th>
                    <th>Position</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>451</td>
                    <td><span class="badge bg-dark border border-secondary text-warning"><i
                                class="bi bi-star-fill me-1"></i> CHIEF</span></td>
                    <td>John Smith</td>
                    <td>Station 3</td>
                    <td>Battalion A</td>
                    <td>Battalion Chief</td>
                    <td>
                        <div class="dropdown">
                            <button class="btn btn-success btn-sm dropdown-toggle w-100" type="button"
                                data-bs-toggle="dropdown">Present</button>
                            <ul class="dropdown-menu dropdown-menu-dark">
                                @for(st of status; track st){
                                <li><a class="dropdown-item" href="#">{{st}}</a></li>
                                }

                            </ul>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="d-flex justify-content-end mt-3 mb-5">
        <button class="btn btn-warning fw-bold px-4">Save Changes</button>
        <button class="btn btn-dark border-secondary px-4 ms-2">Cancel</button>
    </div>
</div>

<footer class="container-fluid py-4 border-top border-secondary text-center text-white-50">
    <p class="small mb-1">City of Tulsa Fire Department</p>
    <p class="x-small">© 2026 City of Tulsa Fire Department.</p>
</footer>
